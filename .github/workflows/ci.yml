name: Workspace checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Root build and test:unit reach @hrm/api-go, whose scripts call go.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      # Root scripts orchestrate app-owned commands.
      - run: pnpm run build
      - run: pnpm run test:unit
      # Testcontainers starts disposable postgres:18.6-bookworm containers on the runner's Docker engine.
      - run: pnpm run test:integration
      - run: pnpm run test:e2e
      # Browser E2E (apps/web): real API + PostgreSQL + fake HTTPS IdP; Chromium needs system libraries.
      - run: pnpm --filter @hrm/web exec playwright install --with-deps chromium
      - run: pnpm run test:browser
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum
      - run: go vet ./...
      - run: go tool golangci-lint run
      - run: go test -race ./...
