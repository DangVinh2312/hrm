version: '2'

run:
  build-tags:
    - integration

linters:
  default: none
  enable:
    - contextcheck
    - depguard
    - errcheck
    - exhaustive
    - forbidigo
    - gosec
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
  settings:
    errcheck:
      check-blank: true
    depguard:
      rules:
        authorization-core:
          files:
            - '**/internal/authorization/core/**'
            - '!$test'
          list-mode: strict
          allow:
            - $gostd
          deny:
            - pkg: net
              desc: core does no I/O
            - pkg: database/sql
              desc: core does no I/O
            - pkg: os
              desc: core does no I/O
            - pkg: crypto
              desc: core has no crypto; the adapter hashes the canonical form
            - pkg: syscall
              desc: core does no I/O
            - pkg: log
              desc: core does no I/O; the caller logs the decision reason
            - pkg: io/ioutil
              desc: core does no I/O
        cmd-api:
          files:
            - '**/cmd/api/**'
          deny:
            - pkg: hrm/api-go/internal/offline
              desc: cmd/api serves HTTP only; offline commands belong to cmd/hrmctl
        gin-binding:
          deny:
            - pkg: github.com/gin-gonic/gin/binding
              desc: decode with httpapi.DecodeCommand and validate explicitly
    exhaustive:
      default-signifies-exhaustive: false
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^gin\.(Default|Logger|Recovery|CustomRecovery)
          pkg: ^github\.com/gin-gonic/gin$
          msg: use gin.New with the logging and recovery of httpapi; the default logger writes query strings, the default recovery answers 500
        - pattern: ^gin\.Context\.(ClientIP|RemoteIP)$
          pkg: ^github\.com/gin-gonic/gin$
          msg: use httpapi.ClientIP, which follows TRUST_PROXY
        - pattern: ^gin\.Context\.(Cookie|SetCookie)
          pkg: ^github\.com/gin-gonic/gin$
          msg: use httpapi.Cookies and httpapi.SetCookie; Gin takes the first of a repeated cookie and has no __Host- prefix
        - pattern: ^gin\.Context\.(GetRawData|PostForm|DefaultPostForm|GetPostForm|FormFile|MultipartForm|SaveUploadedFile)
          pkg: ^github\.com/gin-gonic/gin$
          msg: read a body only through httpapi.DecodeCommand, which bounds and checks it
        - pattern: ^http\.Request\.(Body|Form|PostForm|MultipartForm|ParseForm|ParseMultipartForm|FormValue|PostFormValue|FormFile|MultipartReader|Write|WriteProxy)$
          pkg: ^net/http$
          msg: only httpapi.DecodeCommand reads a request body
        - pattern: ^httputil\.DumpRequest(Out)?$
          pkg: ^net/http/httputil$
          msg: only httpapi.DecodeCommand reads a request body
        - pattern: ^gin\.(Engine|RouterGroup|IRoutes|IRouter)\.(Handle|GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|Any|Match|Static|StaticFile|StaticFileFS|StaticFS|NoRoute|NoMethod)$
          pkg: ^github\.com/gin-gonic/gin$
          msg: add routes with httpapi.Register, which installs the classification check; CheckRoutes refuses others
        - pattern: ^gin\.Engine\.Run
          pkg: ^github\.com/gin-gonic/gin$
          msg: serve with httpapi.NewServer, which sets the connection limits
        - pattern: ^gin\.Context\.(ShouldBind|Bind|MustBindWith)
          pkg: ^github\.com/gin-gonic/gin$
          msg: decode with httpapi.DecodeCommand into a struct and validate explicitly
        - pattern: ^time\.(Now|Since|Until)$
          pkg: ^time$
          msg: the database clock is the authority
        - pattern: ^time\.(After|AfterFunc|Tick|NewTicker|Sleep|NewTimer)$
          pkg: ^time$
          msg: authorization core and values are pure; they hold no timer
    rowserrcheck:
      packages:
        - github.com/jackc/pgx/v5
  exclusions:
    rules:
      - path-except: internal/authorization/(authority|core|values)/
        text: the database clock is the authority
        linters:
          - forbidigo
      - path-except: internal/authorization/(core|values)/
        text: they hold no timer
        linters:
          - forbidigo
      - path: internal/authorization/(core|values)/.*_test\.go$
        text: (the database clock is the authority|they hold no timer)
        linters:
          - forbidigo
      - path: (internal/httpapi/engine|internal/httpapi/[a-z_]+_test|internal/app/[a-z_]+_test)\.go$
        text: add routes with httpapi.Register
        linters:
          - forbidigo
      - path: (internal/httpapi/body|_test)\.go$
        text: only httpapi.DecodeCommand reads a request body
        linters:
          - forbidigo
      - path: _test\.go$
        linters:
          - gosec

formatters:
  enable:
    - gofmt
