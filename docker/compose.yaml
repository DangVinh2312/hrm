# Local development only: PostgreSQL, one-shot provision (roles + migrations), API (Go in front of NestJS) and Vite dev server.
# Credentials: .env.ops (postgres + offline CLI) and .env.api (API runtime), both gitignored.
# Data lives in ./volumes (gitignored); project differs from apps/api/compose.yaml (hrm); host port 5432 must be free.
name: hrm-local
services:
  postgres:
    image: postgres:18.6-bookworm
    env_file: .env.ops
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - ./volumes/postgres/data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  # Idempotent: keeps existing roles and applies only missing migrations.
  setup:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: hrm-local
    working_dir: /app/apps/api
    env_file: .env.ops
    command: ['node', 'tools/product.ts', 'provision']
    depends_on:
      postgres:
        condition: service_healthy

  manifest:
    image: golang:1.27.3-bookworm
    working_dir: /src
    env_file: .env.api
    command: ['go', 'run', './cmd/hrmctl', 'sync']
    volumes:
      - ../apps/api-go:/src:ro
      - ./volumes/go:/go
    depends_on:
      setup:
        condition: service_completed_successfully

  api:
    image: hrm-local
    working_dir: /app/apps/api
    env_file: .env.api
    # Behind api-go: trusts exactly that one hop.
    environment:
      TRUST_PROXY: '1'
    # Hot reload: tsc rebuilds dist from the mounted src, node restarts on changed output.
    # Each restart verifies the Go-owned manifest. New migrations still need `setup` (rebuild).
    command:
      - sh
      - -c
      - pnpm exec tsc -b tsconfig.build.json --watch --preserveWatchOutput & exec node --watch dist/main.js
    volumes:
      - ../apps/api/src:/app/apps/api/src:ro
      - ../apps/api-go/contract:/app/apps/api-go/contract:ro
    depends_on:
      manifest:
        condition: service_completed_successfully

  # In front of NestJS: serves the migrated routes, proxies the rest. TRUST_PROXY stays that of .env.api.
  api-go:
    image: golang:1.27.3-bookworm
    working_dir: /src
    env_file: .env.api
    environment:
      API_UPSTREAM_URL: http://api:6868
    command: ['go', 'run', './cmd/api']
    volumes:
      - ../apps/api-go:/src:ro
      - ./volumes/go:/go
    depends_on:
      - api

  # Same origin for browser and API: Vite proxies /api to the API without rewriting Origin.
  web:
    image: hrm-local
    working_dir: /app/apps/web
    environment:
      HRM_API_TARGET: http://api-go:6868
      HRM_WEB_PORT: '6368'
      VITE_OIDC_ISSUER: https://accounts.google.com
    command: ['pnpm', 'exec', 'vite', '--host', '0.0.0.0']
    ports:
      - '127.0.0.1:6368:6368'
    volumes:
      - ../apps/web/src:/app/apps/web/src:ro
    depends_on:
      - api-go
